    <style>
        /* Smooth transitions for theme switcher */
        body {
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        /* Architectural drafting lines */
        .drafting-grid {
            background-size: 30px 30px;
            background-image: linear-gradient(to right, rgba(206, 90, 62, 0.04) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(206, 90, 62, 0.04) 1px, transparent 1px);
            transition: background-image 0.5s ease;
        }

        /* Page Transition States */
        .page-transition {
            transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .page-enter {
            opacity: 0;
            transform: translateY(30px);
        }
        .page-enter-active {
            opacity: 1;
            transform: translateY(0);
        }
        .page-exit {
            opacity: 1;
            transform: translateY(0);
        }
        .page-exit-active {
            opacity: 0;
            transform: translateY(-30px);
        }

        /* 3D Flip Card Styles */
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
        /* Active Flip State Transition */
        .card-inner.is-flipped {
            transform: rotateY(180deg);
        }

        /* Kinetic 3D Letter Drop-Down and Bounce Keyframes */
        @keyframes letterDropBounce {
            0% {
                transform: translateY(-200px) rotateX(-90deg) scaleY(2);
                opacity: 0;
                filter: blur(4px);
            }
            45% {
                transform: translateY(0) rotateX(0deg) scaleY(0.65);
                opacity: 1;
                filter: blur(0);
            }
            65% {
                transform: translateY(-24px) rotateX(15deg) scaleY(1.15);
            }
            80% {
                transform: translateY(6px) rotateX(-5deg) scaleY(0.9);
            }
            92% {
                transform: translateY(-2px) rotateX(2deg) scaleY(1.02);
            }
            100% {
                transform: translateY(0) rotateX(0) scaleY(1);
                opacity: 1;
                filter: blur(0);
            }
        }
        
        .letter-bounce {
            animation: letterDropBounce 1.2s cubic-bezier(0.28, 0.84, 0.42, 1) forwards;
            transform-origin: bottom center;
        }

        /* Flow-Connection Horizontal Color Wave Animation */
        @keyframes colorWave {
            0%, 100% {
                color: #191919;
                transform: scale(1);
            }
            30% {
                color: #CE5A3E; /* Terracotta flow accent */
                transform: scale(1.18) translateY(-6px);
                text-shadow: 0 8px 16px rgba(206, 90, 62, 0.2);
            }
            60% {
                color: #191919;
                transform: scale(1);
            }
        }

        .letter-wave-active {
            animation: colorWave 1.4s ease-in-out infinite;
        }

        /* Hide default scrollbars cleanly */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;

    <!-- LOGIC SYSTEM SCRIPT -->
    <script>
        // 1. PAGE LOAD SYSTEM (ANIMATED INTRO LOADING SCREEN)
        window.addEventListener('DOMContentLoaded', () => {
            const loadingScreen = document.getElementById('loadingScreen');
            const loadingBar = document.getElementById('loadingBar');
            const loadingPercent = document.getElementById('loadingPercent');
            const loadingSystemStatus = document.getElementById('loadingSystemStatus');
            const logoLettersContainer = document.getElementById('logoLettersContainer');

            // Text configuration
            const brandText = "FLUXUSER STUDIOZ";
            
            // Build letter spans with inline styles dynamically to prevent cluttering the HTML source
            brandText.split('').forEach((char, index) => {
                const charSpan = document.createElement('span');
                if (char === ' ') {
                    // Create spacing for whitespace
                    charSpan.className = "w-4 sm:w-6 inline-block";
                } else {
                    charSpan.textContent = char;
                    charSpan.className = "letter-bounce opacity-0 inline-block font-syne font-extrabold text-2xl sm:text-4xl text-charcoal tracking-normal transform-style-3d";
                    // Stagger drop interval with 75ms offset per letter
                    charSpan.style.animationDelay = `${index * 75}ms`;
                }
                logoLettersContainer.appendChild(charSpan);
            });

            // Handle progress track logic
            let progress = 0;
            const progressInterval = setInterval(() => {
                progress += Math.floor(Math.random() * 8) + 3;
                
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(progressInterval);
                    
                    // Assembly stage (Decrease spacing, align & trigger wave)
                    setTimeout(() => {
                        loadingSystemStatus.textContent = "blueprints assembled";
                        logoLettersContainer.classList.add('gap-0.5', 'md:gap-1'); // Draw together dynamically
                        
                        // Activate flowing connection wave across dropped letters
                        const letters = logoLettersContainer.querySelectorAll('.letter-bounce');
                        letters.forEach((letter, index) => {
                            letter.style.transition = "all 0.6s cubic-bezier(0.16, 1, 0.3, 1)";
                            // Stagger wave sequence start times
                            setTimeout(() => {
                                letter.classList.add('letter-wave-active');
                            }, index * 80);
                        });

                        // Complete screen transition and reveal full page content
                        setTimeout(() => {
                            loadingScreen.classList.add('opacity-0', 'pointer-events-none');
                            setTimeout(() => {
                                loadingScreen.style.display = 'none';
                            }, 1000);
                        }, 1800); // Allow wave to cycle beautifully once

                    }, 800); // Delay once progress bar fills up to allow dropped letters to land
                }

                loadingBar.style.width = progress + '%';
                loadingPercent.textContent = progress + '%';

                // Change status logs as progression triggers
                if (progress > 30 && progress < 70) {
                    loadingSystemStatus.textContent = "rendering layout structures...";
                } else if (progress >= 70 && progress < 99) {
                    loadingSystemStatus.textContent = "encrypting security keys...";
                }
            }, 100);
        });

        // 2. TRANSITIONAL MULTI-PAGE SPA ROUTING ENGINE
        let activePageId = 'home';
        const pageIds = ['home', 'who-we-are', 'what-we-craft', 'selected-work', 'sandbox', 'connect'];
        let hintTimer = null;
        let cardInteracted = false;

        function navigateTo(targetPageId) {
            if (targetPageId === activePageId) return;

            const currentPageElement = document.getElementById(`page-${activePageId}`);
            const targetPageElement = document.getElementById(`page-${targetPageId}`);

            if (!currentPageElement || !targetPageElement) return;

            // Step 1: Fire Exit Animation on current page
            currentPageElement.classList.remove('page-enter-active');
            currentPageElement.classList.add('page-exit-active');

            setTimeout(() => {
                // Step 2: Swap Display parameters
                currentPageElement.classList.add('hidden');
                currentPageElement.classList.remove('page-exit-active');

                targetPageElement.classList.remove('hidden');
                targetPageElement.classList.add('page-enter');

                // Allow layout engine to calculate DOM offsets before triggering entry transitions
                requestAnimationFrame(() => {
                    targetPageElement.classList.add('page-enter-active');
                    targetPageElement.classList.remove('page-enter');
                });

                activePageId = targetPageId;
                window.scrollTo({ top: 0, behavior: 'smooth' });

                // Handle the click-to-flip tap hint if landing on Who We Are page
                if (targetPageId === 'who-we-are') {
                    startHintTimer();
                } else {
                    dismissTapHint();
                }
            }, 350); // Matches transition duration
        }

        // 3. CLICK TO FLIP CONTROLLER LOGIC
        function toggleFounderCard(cardElement) {
            const innerElement = cardElement.querySelector('.card-inner');
            if (innerElement) {
                innerElement.classList.toggle('is-flipped');
                cardInteracted = true;
                dismissTapHint();
            }
        }

        // 4. AUTOPLAY HINT OVERLAY HANDLER
        function startHintTimer() {
            // Clear any old timers
            dismissTapHint();
            
            if (cardInteracted) return; // Don't prompt again if already flipped

            // Wait 2.5 seconds, then show subtle pulsing invitation HUD on front of both cards
            hintTimer = setTimeout(() => {
                const hintLayers = document.querySelectorAll('.tap-hint-layer');
                hintLayers.forEach(layer => {
                    layer.classList.remove('opacity-0', 'pointer-events-none');
                    layer.classList.add('opacity-100');
                });
            }, 2500);
        }

        function dismissTapHint() {
            if (hintTimer) {
                clearTimeout(hintTimer);
                hintTimer = null;
            }
            const hintLayers = document.querySelectorAll('.tap-hint-layer');
            hintLayers.forEach(layer => {
                layer.classList.remove('opacity-100');
                layer.classList.add('opacity-0', 'pointer-events-none');
            });
        }

        function refreshDraftingClock() {
            const clock = document.getElementById('liveClock');
            if (!clock) return;

            const systemOptions = {
                timeZone: 'Asia/Kolkata',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            };
            const timeFormatter = new Intl.DateTimeFormat('en-US', systemOptions);
            clock.textContent = timeFormatter.format(new Date()) + ' IST';
        }

        refreshDraftingClock();

                    <div class="flex justify-between items-center pb-4 relative z-10 border-b border-stone-800">

                            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span> TERRA COTTA CAFE
                        </span>
                        <span class="font-mono text-[9px] text-stone-400 bg-stone-900 px-2 py-0.5 rounded">SERVICES // PORTFOLIO</span>
                    </div>
                    <div class="my-6 relative z-10 space-y-4 text-left px-4">
                        <span class="font-mono text-[10px] text-emerald-400 uppercase font-bold tracking-widest block">[ Live UI Layer Active ]</span>
                        <h1 class="font-syne font-bold text-2xl sm:text-3xl text-white leading-tight">Authentic organic roasts constructed over local artisan design grids.</h1>

                canvasModeLabel.textContent = "RAW APPLICATION DOM COMPILED";

        // Helper to switch sub elements within toolkit capability cards smoothly
        function cardSubElements(specClass, titleClass, descClass) {
